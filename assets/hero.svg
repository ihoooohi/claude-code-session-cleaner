      <text x="27" y="112" fill="#64748b" font-size="12">Safe space for unfinished conversations.</text>
      <text x="27" y="151" fill="#f1f5f9" font-size="13" font-weight="bold">Sessions</text><text x="93" y="151" fill="#64748b" font-size="12">(newest first)</text>
      <text x="27" y="183" fill="#8b5cf6" font-size="12">[  1]</text><text x="82" y="183" fill="#aab4ca" font-size="12">Jul 15  portfolio</text><text x="253" y="183" fill="#cbd5e1" font-size="12">★ polish the release</text>
      <text x="27" y="213" fill="#8b5cf6" font-size="12">[  2]</text><text x="82" y="213" fill="#aab4ca" font-size="12">Jul 14  compiler</text><text x="253" y="213" fill="#cbd5e1" font-size="12">fix parser edge case</text>
      <text x="27" y="243" fill="#8b5cf6" font-size="12">[  3]</text><text x="82" y="243" fill="#aab4ca" font-size="12">Jul 12  notes</text><text x="253" y="243" fill="#cbd5e1" font-size="12">explore storage model</text>
      <text x="27" y="286" fill="#f8fafc" font-size="12" font-weight="bold">Select</text><text x="78" y="286" fill="#64748b" font-size="12">(1 3 5, 2-6):</text><text x="192" y="286" fill="#c4b5fd" font-size="12">1 3</text>
