      <stop offset="0" stop-color="#090d18"/><stop offset=".52" stop-color="#11182a"/><stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="330" fill="url(#glow)"/>
  <circle cx="90" cy="465" r="250" fill="url(#glow)" opacity=".45"/>
  <g opacity=".2" stroke="#8b5cf6"><path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200"/><path d="M120 0v480M240 0v480M360 0v480M480 0v480M600 0v480M720 0v480M840 0v480M960 0v480M1080 0v480"/></g>
  <g transform="translate(82 88)">
