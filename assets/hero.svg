    <text x="0" y="184" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="750">Cleaner</text>
    <text x="2" y="224" fill="#aab4ca" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20">Browse. Reclaim. Restore.</text>
    <g transform="translate(0 260)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">
      <rect width="148" height="34" rx="17" fill="#221d3b" stroke="#6d4bd1"/><text x="18" y="22" fill="#c4b5fd">◆ recoverable</text>
      <rect x="162" width="112" height="34" rx="17" fill="#111c2b" stroke="#334155"/><text x="178" y="22" fill="#b6c2d9">mac + linux</text>
    </g>
  </g>
  <g transform="translate(565 65)" filter="url(#shadow)">
    <rect width="560" height="350" rx="18" fill="#080b13" stroke="#30384e"/>
    <path d="M0 48h560" stroke="#252b3b"/>
    <circle cx="25" cy="24" r="6" fill="#fb7185"/><circle cx="46" cy="24" r="6" fill="#fbbf24"/><circle cx="67" cy="24" r="6" fill="#4ade80"/>
